name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/big_research/bridge.js src/big_research/bridge.js.LEGAL.txt
      - run: uv run ruff check src tests scripts
      - run: uv run coverage run -m unittest discover -s tests -v
      - run: uv run coverage report
      - run: uv run python scripts/validate_repo.py
      - run: uv run python scripts/build_release.py --output dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/big_research/bridge.js src/big_research/bridge.js.LEGAL.txt
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/check_ui.py
      - run: npm install --prefix .cache/client @anthropic-ai/claude-code@2.1.301 @openai/codex@0.163.0
      - run: .cache/client/node_modules/.bin/claude plugin validate .claude-plugin/plugin.json --strict
      - run: .cache/client/node_modules/.bin/claude plugin validate .claude-plugin/marketplace.json --strict
      - name: Clean Claude installation on disposable CI runner
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/research-claude-test
        run: |
          .cache/client/node_modules/.bin/claude plugin marketplace add "$GITHUB_WORKSPACE"
          .cache/client/node_modules/.bin/claude plugin install big-research@big-research-marketplace --scope user
          .cache/client/node_modules/.bin/claude plugin list
      - name: Clean Codex installation on disposable CI runner
        env:
          CODEX_HOME: ${{ runner.temp }}/research-codex-test
        run: |
          mkdir -p "$CODEX_HOME"
          .cache/client/node_modules/.bin/codex plugin marketplace add "$GITHUB_WORKSPACE"
          .cache/client/node_modules/.bin/codex plugin add big-research@big-research-marketplace
          .cache/client/node_modules/.bin/codex plugin list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: .cache/ui-check
