name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check explicit tag matches source version
        run: python -c "import os,pathlib; assert os.environ['GITHUB_REF_TYPE'] != 'tag' or os.environ['GITHUB_REF_NAME'] == 'v'+pathlib.Path('VERSION').read_text().strip()"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/drift-study -p test_experiment.py -v
      - run: python scripts/validate_repo.py
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude plugin validate .claude-plugin/plugin.json --strict
      - run: claude plugin validate .claude-plugin/marketplace.json --strict
      - run: python scripts/build_release.py --output dist
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving the published version."
            exit 0
          fi
          gh release create "$tag" dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Research Workflow $tag" --notes-file "docs/RELEASE-$tag.md"
