name: Guarded release
on:
  schedule:
    - cron: '7,22 3 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Prepare a draft or check the guarded midnight release'
        type: choice
        options: [prepare, tick, status]
        default: tick
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v2.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Read the candidate reference
        id: plan
        run: python -c "import json,os; p=json.load(open('.github/release-plan.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); print('ref='+p['candidate_ref'],file=f)"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare or publish only an accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'tick' }}
        run: python scripts/release.py "$OPERATION"
